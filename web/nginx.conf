server {
    listen 80;

    # Docker's built-in DNS. "api" resolves to all 3 API copies, and nginx
    # re-asks every 10 s, so copies can be added or restarted without a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /assistant/ {
        set $assistant http://assistant:5000;
        rewrite ^/assistant/(.*)$ /$1 break;
        proxy_pass $assistant;
        proxy_read_timeout 120s;
    }

    location = /nginx-health {
        return 200 "ok\n";
    }
}
