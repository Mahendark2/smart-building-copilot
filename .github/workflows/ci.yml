name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sbc
          POSTGRES_PASSWORD: sbc
          POSTGRES_DB: sbc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sbc"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://sbc:sbc@localhost:5432/sbc_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
